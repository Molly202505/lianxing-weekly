<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>良興週報 HTML 互動編輯器</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #00BFFF;
            --brand-orange: #FF8C00;
            --bg-dark: #001529;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        /* Toolbar */
        .toolbar {
            width: 100%;
            background: #222;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn-reset { background: #555; color: white; }
        .btn-toggle { background: var(--primary-blue); color: white; }
        .btn-download { background: var(--brand-orange); color: white; display: none; }

        /* Canvas */
        .wrap {
            width: 540px;
            height: 962px;
            position: relative;
            background-color: var(--bg-dark);
            overflow: hidden;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
        }

        /* Header */
        .hdr {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            color: white;
            z-index: 10;
            text-align: center;
        }
        .hdr .week { font-size: 18px; color: var(--primary-blue); }
        .hdr .title { font-size: 72px; font-weight: 700; margin: 10px 0; }
        .hdr .slogan { font-size: 20px; color: #ccc; }

        /* Content Area */
        .content-area {
            position: absolute;
            top: 250px;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            padding: 8px 20px 48px;
            gap: 8px;
            z-index: 10;
        }

        .block {
            position: relative;
            background: rgba(0, 191, 255, 0.1);
            border: 1px solid rgba(0, 191, 255, 0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            transition: background 0.3s;
        }
        .editing .block { cursor: grab; }
        .editing .block:active { cursor: grabbing; }

        /* Resize Handle */
        .resize-handle {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: transparent;
            cursor: ns-resize;
            display: none;
        }
        .editing .resize-handle { display: block; }
        .editing .resize-handle:hover { background: var(--primary-blue); }

        /* Block Content Styling */
        .block h4 { font-size: 14px; color: var(--primary-blue); margin-bottom: 5px; text-align: center;}
        .kpi-row { display: flex; justify-content: space-around; text-align: center; }
        .kpi-item .num { font-size: 24px; font-weight: bold; display: block; }
        .kpi-item .label { font-size: 12px; opacity: 0.8; }
        
        .hero-num { font-size: 48px; font-weight: bold; text-align: center; color: var(--brand-orange); }
        
        .slist { list-style: none; padding: 0 15px; }
        .slist li { margin-bottom: 5px; font-size: 14px; border-left: 3px solid var(--primary-blue); padding-left: 10px; }

        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 15px; font-size: 13px; }
        
        /* Footer text area */
        .footer-tag {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            z-index: 5;
        }
    </style>
</head>
<body>

<div class="toolbar">
    <button class="btn-reset" onclick="resetFlex()">↺ 重置</button>
    <button class="btn-toggle" id="toggleEdit" onclick="toggleEdit()">🔓 解鎖</button>
    <button class="btn-download" id="btnDownload" onclick="downloadLocked()">⬇ 下載鎖定版</button>
</div>

<div class="wrap" id="captureArea">
    <div class="hdr">
        <div class="week">2026 · 第 4 週</div>
        <h1 class="title">良興週報</h1>
        <div class="slogan">業績創新高 團隊再突破</div>
    </div>

    <div class="content-area" id="contentArea">
        <div class="block" id="blk-kpi" style="flex: 1.4;">
            <h4>KPI 數據</h4>
            <div class="kpi-row">
                <div class="kpi-item"><span class="num">528M</span><span class="label">業績總額</span></div>
                <div class="kpi-item"><span class="num">92%</span><span class="label">達成率</span></div>
                <div class="kpi-item"><span class="num">15k</span><span class="label">新客數</span></div>
            </div>
            <div class="resize-handle"></div>
        </div>
        
        <div class="block" id="blk-hero" style="flex: 1.0;">
            <div class="hero-num">528M</div>
            <div style="text-align:center; font-size:14px;">核心指標 · 年增 38.2%</div>
            <div class="resize-handle"></div>
        </div>

        <div class="block" id="blk-slist" style="flex: 1.8;">
            <h4>本週重點</h4>
            <ul class="slist">
                <li><strong>電商節慶：</strong> 雙五活動開跑，流量增長 20%</li>
                <li><strong>線下門市：</strong> 體驗區升級完成，客單提升</li>
            </ul>
            <div class="resize-handle"></div>
        </div>

        <div class="block" id="blk-bottom" style="flex: 2.2;">
            <div class="bottom-grid">
                <div>
                    <h4 style="text-align:left;">公告事項</h4>
                    <p>5/20 全員大會</p>
                </div>
                <div>
                    <h4 style="text-align:left;">良興哲學</h4>
                    <p>服務至上，共創價值</p>
                </div>
            </div>
            <div class="resize-handle"></div>
        </div>
    </div>
    <div class="footer-tag">良興管理部 · 2026</div>
</div>

<script>
    let isEditing = false;

    function toggleEdit() {
        isEditing = !isEditing;
        const btn = document.getElementById('toggleEdit');
        const dlBtn = document.getElementById('btnDownload');
        const area = document.getElementById('contentArea');
        
        if (isEditing) {
            btn.innerText = '🔒 鎖定';
            dlBtn.style.display = 'none';
            area.classList.add('editing');
            initDragAndResize();
        } else {
            btn.innerText = '🔓 解鎖';
            dlBtn.style.display = 'inline-block';
            area.classList.remove('editing');
        }
    }

    function resetFlex() {
        document.getElementById('blk-kpi').style.flex = "1.4";
        document.getElementById('blk-hero').style.flex = "1.0";
        document.getElementById('blk-slist').style.flex = "1.8";
        document.getElementById('blk-bottom').style.flex = "2.2";
    }

    function initDragAndResize() {
        const blocks = document.querySelectorAll('.block');
        
        blocks.forEach(block => {
            // Resize logic
            const handle = block.querySelector('.resize-handle');
            handle.onmousedown = (e) => {
                e.preventDefault();
                e.stopPropagation();
                const startY = e.clientY;
                const startFlex = parseFloat(block.style.flex);

                window.onmousemove = (moveE) => {
                    const diff = (moveE.clientY - startY) / 100;
                    block.style.flex = Math.max(0.3, startFlex + diff).toFixed(2);
                };
                window.onmouseup = () => {
                    window.onmousemove = null;
                    window.onmouseup = null;
                };
            };

            // Drag logic (Simple implementation)
            block.onmousedown = (e) => {
                if (!isEditing || e.target.classList.contains('resize-handle')) return;
                
                const area = document.getElementById('contentArea');
                const startY = e.clientY;
                const siblings = [...area.querySelectorAll('.block:not(.dragging)')];
                
                block.classList.add('dragging');

                window.onmousemove = (moveE) => {
                    const dy = moveE.clientY - startY;
                    const nextSib = siblings.find(sib => {
                        return moveE.clientY <= sib.offsetTop + sib.offsetHeight / 2;
                    });
                    area.insertBefore(block, nextSib);
                };

                window.onmouseup = () => {
                    block.classList.remove('dragging');
                    window.onmousemove = null;
                    window.onmouseup = null;
                };
            };
        });
    }

    function downloadLocked() {
        let html = document.documentElement.outerHTML;
        // Clean up UI elements for the "Final" version
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        doc.querySelector('.toolbar').remove();
        doc.querySelectorAll('.resize-handle').forEach(h => h.remove());
        doc.querySelectorAll('script').forEach(s => s.remove());
        doc.getElementById('contentArea').classList.remove('editing');
        
        const finalHtml = doc.documentElement.outerHTML;
        const blob = new Blob([finalHtml], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '良興週報_最終版.html';
        a.click();
    }
</script>

</body>
</html>
